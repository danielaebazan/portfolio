    <script>
        const grid = document.getElementById('projects-grid');

        Object.entries(projects).forEach(([id, project]) => {
            grid.innerHTML += `
                <div class="project-wrap">
                    <a class="card-link" href="project.html?id=${id}">
                        <div class="card">
                            <div class="card-column">
                                <div class="card-row title">${project.title}</div>
                                <div class="card-row text">${project.cardDescription}</div>
                            </div>
                            <div class="card-column image">
                                <img class="card-img" src="${project.cardImage}" alt="${project.title}">
                            </div>
                        </div>
                    </a>
                </div>
            `;
        });
    </script>
